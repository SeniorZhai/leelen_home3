name: Publish Home Assistant image

on:
  push:
    branches: [main, feat/nas-container]
    paths:
      - custom_components/**
      - tests/**
      - docker/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check discovery and controls
        run: python3 -m unittest discover -s tests -t .
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: leelen-smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check integration loading and startup
        run: |
          docker run --rm --entrypoint python3 leelen-smoke:local -c 'import sys; sys.path.insert(0, "/opt"); import custom_components.leelen3.config_flow; import custom_components.leelen3.climate; import custom_components.leelen3.fan; import custom_components.leelen3.sensor'
          docker run -d --name leelen-smoke -p 8123:8123 leelen-smoke:local
          trap 'docker logs leelen-smoke; docker rm -f leelen-smoke' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8123/ > /dev/null; then
              docker exec leelen-smoke test -f /config/custom_components/leelen3/manifest.json
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Publish multi-platform image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/seniorzhai/leelen-homeassistant:latest
            ghcr.io/seniorzhai/leelen-homeassistant:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/SeniorZhai/leelen_home3
          cache-from: type=gha
